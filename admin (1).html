<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin · Faction Activity Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=REM:wght@400;600;700&display=swap" rel="stylesheet">
<style>html,body{background:#000;color:#fff;margin:0;font-family:"REM",system-ui,sans-serif}</style></head>
<body data-mode="admin"><div class="wrap"><div id="app" style="padding:16px">Loading…</div></div><div id="toast"></div>
<script src="config.js"></script>
<script>
(()=>{
const ADMIN=document.body.dataset.mode==='admin';
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>'x'+Math.random().toString(36).slice(2,9);
const arr=o=>Object.entries(o||{}).map(([id,v])=>({id,...v}));
const BASE=(window.FACTION_DB_URL||'').trim().replace(/\/$/,'');
const LIVE=/^https:\/\//.test(BASE)&&!BASE.includes('YOUR-PROJECT');
const DEF={types:{t1:{name:'Training',pts:5,o:0},t2:{name:'Patrol',pts:3,o:1},t3:{name:'Raid',pts:10,o:2},t4:{name:'Event',pts:5,o:3},t5:{name:'Defense',pts:8,o:4}},
 ranks:{r1:{name:'Recruit',min:0,color:'#9ca3af'},r2:{name:'Private',min:10,color:'#60a5fa'},r3:{name:'Corporal',min:25,color:'#34d399'},r4:{name:'Sergeant',min:50,color:'#fbbf24'},r5:{name:'Lieutenant',min:100,color:'#fb923c'},r6:{name:'Captain',min:200,color:'#f87171'}}};
let crange='w',cmode='all',S=null,live=false,authed=false,q='',selType=null,confirmId=null,dirty=false;
try{authed=sessionStorage.getItem('adm')==='1'}catch(e){}

const css=document.createElement('style');
css.textContent=`:root{--bg:#000;--card:#0b0b0b;--tx:#fff;--mut:#a3a3a3;--ln:#2a2a2a;--acc:#6d8cff;--acct:#000;--good:#4ade80;--bad:#f87171;--chip:#1c1c1c;color-scheme:dark}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 "REM",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:1100px;margin:0 auto;padding:16px}header{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:14px}
h1{font-size:22px;margin:0}h2{font-size:16px;margin:0 0 10px}.nav{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
button,input{font:inherit;color:var(--tx)}a.btn,button{background:var(--card);border:1px solid var(--ln);border-radius:8px;padding:7px 12px;cursor:pointer;text-decoration:none;color:var(--tx)}
button:hover,a.btn:hover{border-color:var(--acc)}.p,.on{background:var(--acc)!important;color:var(--acct)!important;border-color:var(--acc)!important;font-weight:600}
.g{color:var(--good);font-weight:700}.b,.d{color:var(--bad)}.b{font-weight:700}
input{background:var(--bg);border:1px solid var(--ln);border-radius:8px;padding:7px 10px;min-width:0}input[type=number]{width:90px}
.card{background:var(--card);border:1px solid var(--ln);border-radius:12px;padding:14px;margin-bottom:14px}
.stats{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}.stat{flex:1;min-width:120px;background:var(--card);border:1px solid var(--ln);border-radius:12px;padding:12px}.stat b{display:block;font-size:22px}
.mut{color:var(--mut);font-size:13px}.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.scroll{overflow-x:auto}table{width:100%;border-collapse:collapse}th,td{padding:8px;text-align:left;border-top:1px solid var(--ln);vertical-align:middle}
th{font-size:12px;color:var(--mut);text-transform:uppercase;border-top:0;white-space:nowrap}td.pts{font-weight:700;font-size:17px}
.rank{background:var(--acc);color:var(--acct);border-radius:999px;padding:2px 10px;font-size:13px;font-weight:600;white-space:nowrap}
.chip{background:var(--chip);border-radius:999px;padding:2px 9px;font-size:12px;display:inline-block;margin:1px 3px 1px 0;white-space:nowrap}
.acts{display:flex;gap:5px;flex-wrap:wrap}.award{display:grid;grid-template-columns:repeat(4,max-content);gap:5px}.grip{cursor:grab;color:var(--mut);padding:0 6px;user-select:none;font-size:18px}.dragover{outline:2px dashed var(--acc)}.mini{border:0;background:none;padding:0 5px;font-weight:700;cursor:pointer}.search{width:100%;margin-bottom:8px}.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:8px 0;border-top:1px solid var(--ln)}
.banner{background:var(--chip);border:1px solid var(--acc);border-radius:10px;padding:8px 12px;margin-bottom:14px}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--mut);margin-right:5px}.dot.ok{background:var(--good)}
body[data-mode="public"]{background:transparent}
body[data-mode="public"]::before{content:"";position:fixed;inset:-25%;z-index:-1;pointer-events:none;background:radial-gradient(38% 34% at 22% 28%,rgba(var(--g1,88,101,242),.55),transparent 70%),radial-gradient(34% 34% at 78% 22%,rgba(var(--g2,168,85,247),.45),transparent 70%),radial-gradient(40% 38% at 72% 78%,rgba(var(--g3,20,184,166),.38),transparent 70%),radial-gradient(30% 30% at 18% 82%,rgba(var(--g4,236,72,153),.32),transparent 70%);animation:drift 26s ease-in-out infinite alternate,hue 50s linear infinite}
body[data-mode="public"] .card,body[data-mode="public"] .stat{background:var(--cardbg,rgba(8,8,12,.72));-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
@keyframes drift{0%{transform:translate(-3%,2%) rotate(0deg) scale(1)}50%{transform:translate(4%,-3%) rotate(12deg) scale(1.18)}100%{transform:translate(-2%,4%) rotate(-8deg) scale(1.05)}}
@keyframes hue{to{filter:hue-rotate(360deg)}}
@media(prefers-reduced-motion:reduce){body[data-mode="public"]::before{animation:none}}
#tip{position:fixed;z-index:20;pointer-events:none;background:#111;color:#fff;border:1px solid #444;border-radius:8px;padding:6px 10px;font-size:13px;display:none;max-width:260px;line-height:1.5}
.cf{display:inline-flex;gap:6px;align-items:center;flex-wrap:wrap}.hex{width:92px;font-family:ui-monospace,Consolas,monospace}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:9px 14px;border-radius:10px;display:none;z-index:9}`;
document.head.appendChild(css);

const toast=t=>{const e=$('#toast');e.textContent=t;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display='none',3200)};
const hash=async s=>[...new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s)))].map(b=>b.toString(16).padStart(2,'0')).join('');
const rankList=()=>arr(S.ranks).sort((a,b)=>a.min-b.min);
const THEMEDEF={bg:'#000000',g1:'#5865f2',g2:'#a855f7',g3:'#14b8a6',g4:'#ec4899'};
const hex6=(v,d)=>/^#[0-9a-f]{6}$/i.test(v||'')?v.toLowerCase():d;
const normHex=v=>{v=(v||'').trim().replace(/^#?/,'#');if(/^#[0-9a-f]{3}$/i.test(v))v='#'+[...v.slice(1)].map(c=>c+c).join('');return /^#[0-9a-f]{6}$/i.test(v)?v.toLowerCase():null};
function hslHex(h,s,l){s/=100;l/=100;const k=n=>(n+h/30)%12,a=s*Math.min(l,1-l),f=n=>l-a*Math.max(-1,Math.min(k(n)-3,Math.min(9-k(n),1))),x=n=>Math.round(255*f(n)).toString(16).padStart(2,'0');return '#'+x(0)+x(8)+x(4)}
function lineColors(all){const o=[...all].sort((a,b)=>(a.name||'').localeCompare(b.name||'')),M={};o.forEach((m,i)=>M[m.id]=hex6(m.color,hslHex(Math.round(i*360/o.length),75,60)));return M}
function cfield(k,id,v){return `<span class="cf"><input type="color" data-c="${k}" data-id="${id}" value="${v}" style="width:48px;padding:2px;height:34px" aria-label="Color picker"><input class="hex" data-c="${k}h" data-id="${id}" value="${v}" maxlength="7" aria-label="Hex code" spellcheck="false"><button type="button" data-a="copy">Copy</button><button type="button" data-a="paste">Paste</button></span>`}
function applyTheme(){const t=S.theme||{},bg=hex6(t.bg,THEMEDEF.bg),dark=textOn(bg)==='#fff',r=document.documentElement,rgb=h=>{const n=parseInt(h.slice(1),16);return `${n>>16},${(n>>8)&255},${n&255}`},set=(k,v)=>r.style.setProperty(k,v);
 r.style.background=bg;set('--bg',bg);set('--cardbg',`rgba(${rgb(bg)},.72)`);set('--tx',dark?'#fff':'#111');set('--mut',dark?'#a3a3a3':'#555');set('--ln',dark?'#2a2a2a':'rgba(0,0,0,.18)');set('--chip',dark?'#1c1c1c':'rgba(0,0,0,.07)');set('--card',dark?'#0b0b0b':'#fff');
 ['g1','g2','g3','g4'].forEach(k=>set('--'+k,rgb(hex6(t[k],THEMEDEF[k]))))}
const rankObj=p=>rankList().filter(r=>p>=r.min).pop();
const rankOf=p=>{const r=rankObj(p);return r?r.name:'Unranked'};
const rcol=r=>/^#[0-9a-f]{6}$/i.test((r&&r.color)||'')?r.color:'#6d8cff';
const textOn=h=>{const n=parseInt(h.slice(1),16);return (0.299*(n>>16)+0.587*((n>>8)&255)+0.114*(n&255))>150?'#000':'#fff'};
const badge=r=>{const c=rcol(r);return `<span class="rank" style="background:${c};color:${textOn(c)}">${esc(r?r.name:'Unranked')}</span>`};

// ---------- data layer: live (Firebase REST + SSE) or local demo ----------
function setLocal(p,v){const ks=p.split('/').filter(Boolean);if(!ks.length){S=JSON.parse(JSON.stringify(v||{}));return}
 let o=S;for(let i=0;i<ks.length-1;i++)o=o[ks[i]]=o[ks[i]]||{};const k=ks[ks.length-1];
 if(v&&v['.sv'])o[k]=(Number(o[k])||0)+v['.sv'].increment;else if(v===null)delete o[k];else o[k]=v}
async function W(p,v){setLocal(p,v);render();
 if(LIVE){try{const r=await fetch(`${BASE}/faction${p?'/'+p:''}.json`,{method:'PUT',body:JSON.stringify(v)});if(!r.ok)throw 0}catch(e){toast('Save failed. Check your Firebase rules.')}}
 else try{localStorage.setItem('fac_local',JSON.stringify(S))}catch(e){}}
function seed(){if(ADMIN&&(authed||!LIVE)&&!S.ranks&&!S.incs&&!S.types&&!S.members)W('',DEF)}
async function load(){try{const r=await fetch(`${BASE}/faction.json`);S=(await r.json())||{};live=true;dot();seed();refresh()}catch(e){live=false;dot()}}
function connect(){let t;const sched=()=>{clearTimeout(t);t=setTimeout(load,120)};
 try{const es=new EventSource(`${BASE}/faction.json`);es.addEventListener('put',sched);es.addEventListener('patch',sched);
  es.onopen=()=>{live=true;dot()};es.onerror=()=>{live=false;dot()}}catch(e){}
 setInterval(load,30000);load()}
function dot(){const e=$('#live');if(e){e.className='dot'+(live?' ok':'');e.nextSibling.textContent=live?'Live':'Reconnecting…'}}
function refresh(){const a=document.activeElement;
 if(a&&a.matches&&a.matches('#app input:not(#q)')){dirty=true;return}
 if(a&&a.id==='q'&&$('#list')){renderList();return}render()}

// ---------- views ----------
function hdr(){return `<header><h1>🪖 Faction Activity Tracker</h1><div class="nav">
 ${LIVE?`<span class="mut"><span id="live" class="dot${live?' ok':''}"></span><span>${live?'Live':'Connecting…'}</span></span>`:''}
 <a class="btn ${ADMIN?'':'on'}" href="index.html">Dashboard</a><a class="btn ${ADMIN?'on':''}" href="admin.html">Admin</a>
 ${ADMIN&&authed?'<button data-a="logout">Log out</button>':''}</div></header>
 ${LIVE?'':'<div class="banner">Demo mode: data is saved only in this browser. Add your Firebase URL in <b>config.js</b> to turn on live tracking.</div>'}`}
function cfg(){return `
<div class="card"><h2>Events (each has its own point value; drag ⠿ or use ▲▼ to reorder; 4 buttons per row)</h2>
${evList().map(t=>`<div class="row" data-drop="${t.id}"><span class="grip" draggable="true" data-drag="${t.id}" title="Drag to reorder">⠿</span><button data-a="evup" data-id="${t.id}" aria-label="Move up">▲</button><button data-a="evdn" data-id="${t.id}" aria-label="Move down">▼</button><input data-c="evn" data-id="${t.id}" value="${esc(t.name)}" aria-label="Event name"><input type="number" data-c="evp" data-id="${t.id}" value="${t.pts||0}" aria-label="Points"><span class="mut">points</span><button class="d" data-a="deltype" data-id="${t.id}">Delete</button></div>`).join('')}
<div class="bar" style="margin-top:10px"><input id="nt" placeholder="Event name"><input type="number" id="np" placeholder="Points"><button class="p" data-a="addtype">Add event</button></div></div>
<div class="card"><h2>Ranks &amp; point thresholds</h2>
${rankList().map(r=>`<div class="row">${cfield('rankc',r.id,rcol(r))}<input data-c="rankn" data-id="${r.id}" value="${esc(r.name)}" aria-label="Rank name"><input type="number" data-c="rankm" data-id="${r.id}" value="${r.min}" aria-label="Points needed"><span class="mut">points needed</span><button class="d" data-a="delrank" data-id="${r.id}">Delete</button></div>`).join('')}
<div class="bar" style="margin-top:10px"><input id="rn" placeholder="Rank name"><input type="number" id="rm" placeholder="Points"><span id="rcw">${cfield('rcnew','new','#6d8cff')}</span><button class="p" data-a="addrank">Add rank</button></div></div>
<div class="card"><h2>Graph line colors</h2><div class="mut" style="margin-bottom:8px">Color of each username's line on the main page graph. Paste a hex code or pick one. "Auto" restores the default.</div>
${(()=>{const ms=arr(S.members).sort((a,b)=>(a.name||'').localeCompare(b.name||'')),C=lineColors(ms);return ms.map(m=>`<div class="row"><b style="width:140px">${esc(m.name)}</b>${cfield('linec',m.id,C[m.id])}<button data-a="lineauto" data-id="${m.id}">Auto</button></div>`).join('')||'<span class="mut">Add members first.</span>'})()}</div>
<div class="card"><h2>Main page colors</h2><div class="mut" style="margin-bottom:8px">Shown on the public dashboard only. The background is the base color; the four glows are the animated gradient colors.</div>
${[['bg','Background'],['g1','Glow 1'],['g2','Glow 2'],['g3','Glow 3'],['g4','Glow 4']].map(([k,t])=>`<div class="row"><b style="width:110px">${t}</b>${cfield('theme',k,hex6((S.theme||{})[k],THEMEDEF[k]))}</div>`).join('')}
<div class="bar" style="margin-top:10px"><button data-a="themereset">Reset to default</button></div></div>
<div class="card"><h2>Change password</h2><div class="bar"><input type="password" id="p0" placeholder="Current password"><input type="password" id="p1" placeholder="New password"><input type="password" id="p2" placeholder="Confirm new"><button class="p" data-a="pw">Change</button></div></div>`}
function render(){dirty=false;const app=$('#app');if(S&&!ADMIN)applyTheme();
 if(S===null){app.innerHTML=hdr()+'<p class="mut">Connecting…</p>';return}
 if(ADMIN&&!authed){app.innerHTML=hdr()+'<div class="card" style="max-width:380px"><h2>Admin login</h2><div class="bar"><input type="password" id="pw" placeholder="Password"><button class="p" data-a="login">Enter</button></div></div>';return}
 const types=arr(S.types);if(!types.find(t=>t.id===selType))selType=types[0]?types[0].id:null;
 let h=hdr()+'<div class="stats" id="stats"></div>'+(ADMIN?'':'<div class="card"><h2>🏆 Top 5</h2><div id="top5"></div></div><div class="card"><h2>Points by day (live)</h2><div id="chart"></div></div>')+`<div class="card"><h2>${ADMIN?'Members &amp; points':'All members'}</h2>`;
 if(ADMIN)h+=`<div class="bar" style="margin-bottom:10px"><input id="nm" placeholder="Add username(s), comma separated" style="flex:1;min-width:200px"><button class="p" data-a="addm">Add member</button></div>`;
 h+=`<input class="search" id="q" placeholder="Search usernames…" value="${esc(q)}"><div class="scroll" id="list"></div></div>`;
 if(!ADMIN)h+=`<div class="card"><h2>Rank requirements</h2>${rankList().map(r=>`<span class="chip" style="background:${rcol(r)};color:${textOn(rcol(r))}">${esc(r.name)} · ${r.min}+ pts</span>`).join('')||'<span class="mut">No ranks set yet.</span>'}</div>`;
 if(ADMIN)h+=cfg();
 const y=window.scrollY;app.innerHTML=h;renderList();window.scrollTo(0,y)}
function renderList(){const ms=arr(S.members),types=S.types||{},evs=evList();
 $('#stats').innerHTML=`<div class="stat"><b>${ms.length}</b><span class="mut">Members</span></div><div class="stat"><b>${ms.reduce((s,m)=>s+(m.points||0),0)}</b><span class="mut">Total points</span></div><div class="stat"><b>${rankList().length}</b><span class="mut">Ranks</span></div>`;
 const byPts=(a,b)=>(b.points||0)-(a.points||0)||(a.name||'').localeCompare(b.name||''),byName=(a,b)=>(a.name||'').toLowerCase().localeCompare((b.name||'').toLowerCase())||a.id.localeCompare(b.id);
 const list=ms.filter(m=>(m.name||'').toLowerCase().includes(q.toLowerCase())).sort(ADMIN?byName:byPts);
 const chips=m=>Object.entries(m.acts||{}).filter(([t,c])=>types[t]&&c>0).map(([t,c])=>`<span class="chip">${esc(types[t].name)} ×${c}${ADMIN?` <button class="mini" data-a="actdec" data-id="${m.id}" data-t="${t}" title="Decrease by 1">−</button><button class="mini d" data-a="actdel" data-id="${m.id}" data-t="${t}" title="Remove this activity">✕</button>`:''}</span>`).join('')||'<span class="mut">None yet</span>';
 const head=`<tr><th>#</th><th>Name</th><th>Points</th><th>Suggested rank</th><th>Activities</th>${ADMIN?'<th>Award points</th><th></th>':''}</tr>`;
 const rows=list.map((m,i)=>{const p=m.points||0;
  return `<tr><td class="mut">${i+1}</td>
  <td>${ADMIN?`<input data-c="mname" data-id="${m.id}" value="${esc(m.name)}" aria-label="Username">`:`<b>${esc(m.name)}</b>`}</td>
  <td class="pts">${ADMIN?`<input type="number" data-c="mpts" data-id="${m.id}" value="${p}" aria-label="Points">`:p}</td>
  <td>${badge(rankObj(p))}</td>
  
  <td>${chips(m)}</td>
  ${ADMIN?`<td><div class="award">${evs.map(t=>`<button class="${(t.pts||0)<0?'b':'g'}" data-a="award" data-id="${m.id}" data-n="${t.id}">${esc(t.name)} ${(t.pts||0)>0?'+':''}${t.pts||0}</button>`).join('')}</div></td><td><button class="d" data-a="rm" data-id="${m.id}">${confirmId===m.id?'Sure?':'Remove'}</button></td>`:''}</tr>`}).join('');
 if(!ADMIN)drawExtras(ms);$('#list').innerHTML=`<table><thead>${head}</thead><tbody>${rows||`<tr><td colspan="20" class="mut">${ms.length?'No matches.':'No members yet.'+(ADMIN?' Add usernames above.':'')}</td></tr>`}</tbody></table>`}

function drawExtras(ms){
 const top=[...ms].sort((a,b)=>(b.points||0)-(a.points||0)||(a.name||'').localeCompare(b.name||'')).slice(0,5);
 $('#top5').innerHTML=top.length?top.map((m,i)=>`<div class="row"><b style="width:28px">${i+1}</b><b style="flex:1">${esc(m.name)}</b>${badge(rankObj(m.points||0))}<b>${m.points||0}</b></div>`).join(''):'<span class="mut">No members yet.</span>';
 $('#chart').innerHTML=chart(ms,top)}
let CH=null;
const tip=document.createElement('div');tip.id='tip';document.body.appendChild(tip);
function hl(id){document.querySelectorAll('#chart [data-m]').forEach(el=>{if(el.tagName==='SPAN')return;const on=!id||el.dataset.m===id;el.style.opacity=on?1:.15;if(el.tagName==='polyline')el.setAttribute('stroke-width',id&&on?4:2)})}
function hideTip(){if(tip.style.display==='block'){tip.style.display='none';hl(null)}}
function showTip(html,e){tip.innerHTML=html;tip.style.display='block';const w=tip.offsetWidth,h=tip.offsetHeight;let X=e.clientX+14,Y=e.clientY+14;if(X+w>innerWidth-6)X=e.clientX-w-14;if(Y+h>innerHeight-6)Y=e.clientY-h-14;tip.style.left=Math.max(6,X)+'px';tip.style.top=Math.max(6,Y)+'px'}
const dayFmt=t=>new Date(t).toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric',year:'numeric'});
function segDist(px,py,x1,y1,x2,y2){const dx=x2-x1,dy=y2-y1,l=dx*dx+dy*dy;let t=l?((px-x1)*dx+(py-y1)*dy)/l:0;t=Math.max(0,Math.min(1,t));return Math.hypot(px-(x1+t*dx),py-(y1+t*dy))}
function chartHover(e){const svg=e.target.closest&&e.target.closest('#chart svg');if(!svg||!CH){hideTip();return}
 const r=svg.getBoundingClientRect(),k=CH.VW/r.width,sx=(e.clientX-r.left)*k,sy=(e.clientY-r.top)*k,{series,days,N,L,R,x,y}=CH,step=(CH.VW-L-R)/(N-1),c=Math.max(0,Math.min(N-1,Math.round((sx-L)/step)));
 const dots=[],lines=[];
 series.forEach(s=>{let nd=null;for(let i=Math.max(0,c-1);i<=Math.min(N-1,c+1);i++){const d=Math.hypot(sx-x(i),sy-y(s.v[i]));if(d<=14*k&&(!nd||d<nd.d))nd={s,i,d}}
  if(nd)dots.push(nd);
  const i0=Math.max(0,Math.min(N-2,Math.floor((sx-L)/step)));let best=1e9;
  for(let i=Math.max(0,i0-1);i<=Math.min(N-2,i0+1);i++)best=Math.min(best,segDist(sx,sy,x(i),y(s.v[i]),x(i+1),y(s.v[i+1])));
  if(best<=9*k)lines.push({s,i:c,d:best})});
 // dots/days take priority over plain line hits
 let pick=dots.length?dots.sort((a,b)=>a.d-b.d):lines.sort((a,b)=>a.d-b.d);
 if(!pick.length){hideTip();return}
 const di=pick[0].i;if(dots.length)pick=pick.filter(p=>p.i===di);
 const rows=pick.slice(0,6).map(p=>`<div><span class="dot" style="background:${p.s.col}"></span><b>${esc(p.s.m.name)}</b> · ${p.s.v[di]} pts</div>`).join('')+(pick.length>6?`<div>+${pick.length-6} more</div>`:'');
 hl(pick[0].s.m.id);showTip(`<div style="color:#aaa;font-size:12px">${dayFmt(days[di])}</div>${rows}`,e)}
document.addEventListener('pointermove',chartHover);document.addEventListener('pointerdown',chartHover);
document.addEventListener('mouseover',e=>{const c=e.target.closest&&e.target.closest('#chart .chip[data-m]');if(!c||!CH)return;const s=CH.series.find(s=>s.m.id===c.dataset.m);if(!s)return;hl(s.m.id);showTip(`<div><span class="dot" style="background:${s.col}"></span><b>${esc(s.m.name)}</b> · ${s.m.points||0} pts now</div>`,e)});
document.addEventListener('mouseout',e=>{if(e.target.closest&&e.target.closest('#chart .chip[data-m]'))hideTip()});
const RANGES={w:{d:7,t:'Week'},m:{d:30,t:'Month'},y:{d:365,t:'Year'},y3:{d:1095,t:'3 Years'},y5:{d:1825,t:'5 Years'}};
function chart(ms,top){
 if(!ms.length)return '<span class="mut">Members will appear here once they are added.</span>';
 const N=RANGES[crange].d,logs=arr(S.log),dk=t=>{const d=new Date(t);d.setHours(0,0,0,0);return d.getTime()},today=dk(Date.now());
 // rolling window: always the last N days ending today, so each new day pushes the oldest day out
 const days=[];for(let i=N-1;i>=0;i--){const d=new Date(today);d.setDate(d.getDate()-i);days.push(d.getTime())}
 const delta={};logs.forEach(l=>{const d=delta[l.m]=delta[l.m]||{},k=dk(l.t);d[k]=(d[k]||0)+(l.p||0)});
 const shown=(cmode==='top5'?[...top]:[...ms]).sort((a,b)=>(a.name||'').localeCompare(b.name||''));
 const colors=lineColors(ms);const series=shown.map((m,i)=>{const dm=delta[m.id]||{},v=new Array(N);let cur=m.points||0;
  for(let j=N-1;j>=0;j--){v[j]=cur;cur-=(dm[days[j]]||0)}
  return{m,v,col:colors[m.id]}});
 const all=series.flatMap(s=>s.v),max=Math.max(1,...all),min=Math.min(0,...all),VW=700,VH=270,L=40,R=26,T=10,B=34;
 const x=i=>L+i*(VW-L-R)/(N-1),y=v=>T+(max-v)*(VH-T-B)/(max-min);
 const lab=i=>{const d=new Date(days[i]);
  if(N===7)return d.toLocaleDateString(undefined,{weekday:'short',month:'numeric',day:'numeric'});
  if(N===30)return (N-1-i)%5===0?d.toLocaleDateString(undefined,{month:'numeric',day:'numeric'}):'';
  const step=N===365?1:N===1095?3:6;
  return d.getDate()===1&&d.getMonth()%step===0?d.toLocaleDateString(undefined,{month:'short',year:'2-digit'}):''};
 let g='';for(let k=0;k<=4;k++){const val=min+(max-min)*k/4;g+=`<line x1="${L}" x2="${VW-R}" y1="${y(val)}" y2="${y(val)}" style="stroke:var(--ln)"/><text x="${L-6}" y="${y(val)+4}" font-size="11" text-anchor="end" fill="currentColor">${Math.round(val)}</text>`}
 // one tick per day along the bottom; labeled days get a longer tick
 const base=VH-B;let ticks='',labels='';
 for(let i=0;i<N;i++){const t=lab(i);ticks+=`M${x(i)} ${base}v${t?7:3}`;
  if(t)labels+=`<text x="${x(i)}" y="${VH-8}" font-size="11" text-anchor="${i===0?'start':i===N-1?'end':'middle'}" fill="currentColor">${t}</text>`}
 g+=`<path d="${ticks}" style="stroke:var(--mut)" fill="none"/>${labels}`;
 const lines=series.map(s=>`<polyline data-m="${s.m.id}" fill="none" stroke="${s.col}" stroke-width="2" stroke-linejoin="round" points="${s.v.map((p,i)=>x(i).toFixed(1)+','+y(p).toFixed(1)).join(' ')}"/>`+(N<=30?s.v.map((p,i)=>`<circle data-m="${s.m.id}" cx="${x(i)}" cy="${y(p)}" r="2.5" fill="${s.col}"/>`).join(''):`<circle data-m="${s.m.id}" cx="${x(N-1)}" cy="${y(s.v[N-1])}" r="3.5" fill="${s.col}"/>`)).join('');
 CH={series,days,N,L,R,VW,VH,x,y};const btn=(a,k,t,cur)=>`<button class="${cur===k?'on':''}" data-a="${a}" data-id="${k}">${t}</button>`;
 return `<div class="bar" style="margin-bottom:8px">${Object.entries(RANGES).map(([k,r])=>btn('crange',k,r.t,crange)).join('')}<span style="width:10px"></span>${btn('cmode','all','Everyone',cmode)}${btn('cmode','top5','Top 5 only',cmode)}</div>
 <div class="mut" style="margin-bottom:6px">Total points per username, last ${N===7?'7 days':N===30?'30 days':N===365?'year':N===1095?'3 years':'5 years'} (rolling, ends today)</div>
 <svg viewBox="0 0 ${VW} ${VH}" style="width:100%;height:auto;color:var(--mut)" role="img" aria-label="Points by day">${g}${lines}</svg>
 <div style="margin-top:8px">${series.map(s=>`<span class="chip" data-m="${s.m.id}"><span class="dot" style="background:${s.col}"></span>${esc(s.m.name)} · ${s.m.points||0}</span>`).join('')}</div>`}

const evList=()=>arr(S.types).sort((a,b)=>(a.o==null?1e9:a.o)-(b.o==null?1e9:b.o)||(a.name||'').localeCompare(b.name||'')||a.id.localeCompare(b.id));
function saveEvOrder(l){const o={};l.forEach((t,i)=>o[t.id]={name:t.name,pts:t.pts||0,o:i});W('types',o)}
function moveEv(id,dir){const l=evList(),i=l.findIndex(t=>t.id===id),j=i+dir;if(i<0||j<0||j>=l.length)return;[l[i],l[j]]=[l[j],l[i]];saveEvOrder(l)}
function reorderEv(from,to){const l=evList(),i=l.findIndex(t=>t.id===from),j=l.findIndex(t=>t.id===to);if(i<0||j<0||i===j)return;const[x]=l.splice(i,1);l.splice(j,0,x);saveEvOrder(l)}
let dragId=null;
document.addEventListener('dragstart',e=>{const g=e.target.closest&&e.target.closest('[data-drag]');if(g){dragId=g.dataset.drag;e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('text/plain',dragId)}});
document.addEventListener('dragover',e=>{if(dragId&&e.target.closest('[data-drop]'))e.preventDefault()});
document.addEventListener('drop',e=>{const r=e.target.closest('[data-drop]');if(!dragId||!r)return;e.preventDefault();const f=dragId;dragId=null;reorderEv(f,r.dataset.drop)});
document.addEventListener('dragend',()=>{dragId=null});

// ---------- actions ----------
document.addEventListener('click',async e=>{const b=e.target.closest('[data-a]');if(!b)return;
 const a=b.dataset.a,id=b.dataset.id,v=s=>(($(s)||{}).value||''),m=(S.members||{})[id];
 if(a==='cmode'||a==='crange'){if(a==='cmode')cmode=id;else crange=id;renderList();return}
 if(a==='login'){const pw=v('#pw'),h=await hash(pw);if(S.pwHash?h===S.pwHash:pw==='Op1ateSlay3r'){authed=true;try{sessionStorage.setItem('adm','1')}catch(x){}seed();render()}else toast('Wrong password');return}
 if(!ADMIN||!authed)return;
 if(a==='logout'){authed=false;try{sessionStorage.removeItem('adm')}catch(x){}render()}
 else if(a==='award'&&m){const tid=b.dataset.n,ev=(S.types||{})[tid];if(!ev)return;const pt=Number(ev.pts)||0;W(`members/${id}/points`,{'.sv':{increment:pt}});W(`members/${id}/acts/${tid}`,{'.sv':{increment:1}});W('log/'+uid(),{m:id,p:pt,t:Date.now()});toast(`${ev.name} ${pt>=0?'+':''}${pt} → ${m.name}`)}
 else if(a==='rm'&&m){if(confirmId===id){confirmId=null;W('members/'+id,null)}else{confirmId=id;renderList();setTimeout(()=>{if(confirmId===id){confirmId=null;renderList()}},3000)}}
 else if(a==='addm'){const have=arr(S.members).map(x=>(x.name||'').toLowerCase());let n=0;
  v('#nm').split(/[\n,]+/).map(s=>s.trim()).filter(Boolean).forEach(nm=>{if(!have.includes(nm.toLowerCase())){have.push(nm.toLowerCase());W('members/'+uid(),{name:nm,points:0});n++}});
  toast(n?n+' added':'Nothing new to add')}
 else if(a==='evup'||a==='evdn')moveEv(id,a==='evup'?-1:1);
 else if(a==='copy'){const h=b.parentElement.querySelector('.hex');try{await navigator.clipboard.writeText(h.value);toast('Copied '+h.value)}catch(x){h.focus();h.select();try{document.execCommand('copy');toast('Copied '+h.value)}catch(y){toast('Press Ctrl+C to copy')}}}
 else if(a==='paste'){const h=b.parentElement.querySelector('.hex');try{h.value=(await navigator.clipboard.readText()).trim();h.dispatchEvent(new Event('change',{bubbles:true}))}catch(x){h.focus();h.select();toast('Press Ctrl+V (or long-press, Paste) in the hex box')}}
 else if(a==='lineauto')W(`members/${id}/color`,null);
 else if(a==='themereset')W('theme',null);
 else if(a==='actdec'&&m){const t=b.dataset.t,c=(m.acts||{})[t]||0;if(c>1)W(`members/${id}/acts/${t}`,{'.sv':{increment:-1}});else W(`members/${id}/acts/${t}`,null)}
 else if(a==='actdel'&&m)W(`members/${id}/acts/${b.dataset.t}`,null);
 else if(a==='addtype'){const t=v('#nt').trim(),p=parseInt(v('#np'));if(t&&!isNaN(p)){const o={};evList().forEach((x,i)=>o[x.id]={name:x.name,pts:x.pts||0,o:i});o[uid()]={name:t,pts:p,o:Object.keys(o).length};W('types',o)}else toast('Enter an event name and its points')}
 else if(a==='deltype')W('types/'+id,null);
 else if(a==='addrank'){const n=v('#rn').trim(),p=parseInt(v('#rm'));if(n&&!isNaN(p))W('ranks/'+uid(),{name:n,min:p,color:hex6(v('#rcw .hex'),'#6d8cff')});else toast('Enter a rank name and points')}
 else if(a==='delrank')W('ranks/'+id,null);
 else if(a==='pw'){const cur=v('#p0'),h0=await hash(cur);if(S.pwHash?h0!==S.pwHash:cur!=='Op1ateSlay3r')return toast('Current password is wrong');
  if(v('#p1').length<4)return toast('New password must be at least 4 characters');if(v('#p1')!==v('#p2'))return toast('New passwords do not match');
  W('pwHash',await hash(v('#p1')));toast('Password changed')}
});
document.addEventListener('change',e=>{const t=e.target,c=t.dataset.c;if(!c||!ADMIN||!authed)return;const id=t.dataset.id,num=parseInt(t.value);
 const CP={rankc:i=>`ranks/${i}/color`,linec:i=>`members/${i}/color`,theme:i=>`theme/${i}`};
 if(c==='rcnew'){t.parentElement.querySelector('.hex').value=t.value;return}
 if(c==='rcnewh'){const h=normHex(t.value);if(h)t.parentElement.querySelector('input[type=color]').value=h;else toast('Not a valid hex color');return}
 if(c in CP){W(CP[c](id),t.value);return}
 if(c.endsWith('h')&&c.slice(0,-1) in CP){const h=normHex(t.value);if(h)W(CP[c.slice(0,-1)](id),h);else{toast('Not a valid hex color, e.g. #1a2b3c');render()}return}
 if(c==='mname'){const n=t.value.trim();if(n)W(`members/${id}/name`,n)}
 else if(c==='mpts'){if(!isNaN(num))W(`members/${id}/points`,num)}
 else if(c==='evn'){const n=t.value.trim();if(n)W(`types/${id}/name`,n)}
 else if(c==='evp'){if(!isNaN(num))W(`types/${id}/pts`,num)}
 else if(c==='rankn'){const n=t.value.trim();if(n)W(`ranks/${id}/name`,n)}
 else if(c==='rankm'){if(!isNaN(num))W(`ranks/${id}/min`,num)}
 else if(c==='rankc')W(`ranks/${id}/color`,t.value);
});
document.addEventListener('input',e=>{if(e.target.id==='q'){q=e.target.value;renderList()}});
document.addEventListener('keydown',e=>{if(e.key!=='Enter')return;const t=e.target.id;
 if(t==='pw'||t==='nm'){const b=document.querySelector(t==='pw'?'[data-a=login]':'[data-a=addm]');b&&b.click()}});
document.addEventListener('focusout',()=>setTimeout(()=>{if(dirty&&!(document.activeElement&&document.activeElement.matches('#app input')))render()},50));

// ---------- start ----------
if(LIVE){render();connect()}
else{try{S=JSON.parse(localStorage.getItem('fac_local')||'null')}catch(e){}S=S||JSON.parse(JSON.stringify(DEF));render();
 window.addEventListener('storage',()=>{try{S=JSON.parse(localStorage.getItem('fac_local'))||S;refresh()}catch(e){}})}
})();
